import org.gradle.nativeplatform.toolchain.Gcc; allprojects { afterEvaluate { p -> if (p.plugins.hasPlugin("cpp") || p.plugins.hasPlugin("c")) { p.model { toolChains { gcc(Gcc) { target("linux_arm_64") { cCompiler.executable = "aarch64-linux-gnu-gcc"; cppCompiler.executable = "aarch64-linux-gnu-g++"; linker.executable = "aarch64-linux-gnu-g++"; assembler.executable = "aarch64-linux-gnu-as"; staticLibArchiver.executable = "aarch64-linux-gnu-ar" } } }; binaries { all { b -> if (b.targetPlatform.name == "linux_arm_64") { b.linker.args "-static" } } } } } } }
